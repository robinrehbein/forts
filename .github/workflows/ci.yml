name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm:
    name: JVM-Tests (KMP-Module + Simrunner)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests
        run: >
          ./gradlew --stacktrace
          :engine:jvmTest :content:jvmTest :setup:jvmTest :ai:jvmTest :render-api:jvmTest
          :tools:simrunner:test :tools:simrunner:build
      - name: Simrunner smoke run
        run: ./gradlew :tools:simrunner:run --args="--ticks 600 --hash"
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-test-reports
          path: '**/build/reports/tests/'

  android:
    name: Android (assemble + lint)
    runs-on: ubuntu-latest
    needs: jvm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Der Runner bringt ein Android-SDK mit (ANDROID_HOME); fehlende Pakete installiert AGP selbst.
      - name: SDK-Pfad
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Assemble + Lint
        run: ./gradlew --stacktrace :render-android:assembleDebug :app:assembleDebug :app:lintDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
